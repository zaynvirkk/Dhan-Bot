[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sablestone-dhan-cas-bot"
version = "0.2.0"
description = "Dhan execution service for the SableStone NIFTY CAS strategy"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.27.2",
  "protobuf==5.28.3",
  "websockets==13.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[project.scripts]
dhan-cas = "dhan_cas_bot.cli:main"

[tool.setuptools.packages.find]
include = ["dhan_cas_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
